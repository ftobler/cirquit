name: pages
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Gitea Actions would also read this file; no-op there.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@wasm-pack

      - uses: extractions/setup-just@v2

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Build wasm and react
        run: just build
        env:
          # Site is served under the repo path, see web/vite.config.ts.
          BASE_PATH: /cirquit/

      - name: Build the root-deployment zip
        env:
          # Explicit, so this step never inherits BASE_PATH from the build
          # above. The root build's asset paths must be /assets/... absolute
          # for the zip to work at a domain root. The wasm and typecheck come
          # from the preceding `just build` step, so only vite runs here.
          BASE_PATH: /
        run: |
          # The About dialog offers a root-deployment download: the same app
          # built with no base path, zipped so unzipping at a domain root works
          # (the root build's asset paths are /assets/... absolute). The pages
          # build above is moved aside so the second vite build cannot clobber
          # it, and restored, with the zip inside, before the artifact upload.
          # The cd-based commands run in subshells so the working directory
          # stays at the repo root throughout the step.
          mv web/dist web/dist-pages
          (cd web && npx vite build)
          (cd web/dist && zip -r ftobler-cirquit.zip .)
          mv web/dist/ftobler-cirquit.zip web/dist-pages/ftobler-cirquit.zip
          rm -rf web/dist
          mv web/dist-pages web/dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
