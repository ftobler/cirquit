name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tools are installed with their own installers rather than through
      # marketplace actions. Gitea points GITHUB_API_URL at this instance, so
      # any action that resolves a GitHub release through the API looks it up
      # in the wrong place and fails.
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable \
                -c rustfmt -c clippy -t wasm32-unknown-unknown
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install just and wasm-pack
        run: |
          curl -sSfL https://just.systems/install.sh \
            | bash -s -- --to "$HOME/.cargo/bin" || cargo install just --locked
          curl -sSfL https://rustwasm.github.io/wasm-pack/installer/init.sh \
            | sh || cargo install wasm-pack --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
        working-directory: web

      # Same recipe developers run locally: lint, test, build.
      - run: just ci

      - uses: actions/upload-artifact@v3
        with:
          name: site
          path: web/dist
          retention-days: 7
